# Lance un backtest sur les serveurs GitHub et renvoie ses résultats.
#
# POURQUOI. Les sorties de backtest ne sont pas versionnées (voir .gitignore) :
# ce sont des résultats, pas des entrées, et elles pesaient la moitié du dépôt.
# Elles voyagent donc par ARTEFACT plutôt que par commit -- `python
# recuperer_backtest.py` les rapatrie dans data/backtest_options/ sur ton PC,
# où `make audit` et le dashboard les lisent comme un run local.
#
# Déclenchement MANUEL uniquement (onglet Actions > Backtest > Run workflow).
# Pas de déclenchement sur push : un backtest dure des minutes et consomme du
# quota de bande passante LFS, le lancer à chaque commit n'aurait aucun sens.
#
# LE POINT COÛTEUX, ET CE QUI EST FAIT POUR. Un `checkout` avec `lfs: true`
# rapatrierait TOUT le contenu LFS du dépôt (307 Mo, dont 246 Mo de cache
# d'index SEC dont aucun backtest n'a besoin) à chaque run, et chaque
# téléchargement compte contre le quota de bande passante LFS -- 1 Go/mois sur
# le palier gratuit, soit trois runs. D'où deux précautions :
#
#   1. on EXCLUT le cache SEC et la mémoire des classifications 8-K, et on
#      rapatrie tout le reste : ~61 Mo au lieu de 307 ;
#   2. les objets LFS déjà téléchargés sont mis en cache entre les runs, donc
#      un second backtest sur les mêmes données ne consomme rien.
#
# POURQUOI EXCLURE PLUTÔT QU'ÉNUMÉRER. La première version listait les fichiers
# que 09/10 lisent. Elle en oubliait un -- data/dcf/validation_qualitative.parquet,
# lu indirectement par load_valorisation_combinee_history via le filtre
# qualitatif -- et le run échouait sur « Parquet magic bytes not found in
# footer », une erreur qui envoie chercher une corruption là où il ne manquait
# qu'un fichier. Une liste de ce qu'il FAUT se périme dès qu'un chargeur lit
# un fichier de plus ; une liste de ce qui est INUTILE ne se périme pas.

name: Backtest

on:
  workflow_dispatch:
    inputs:
      strategie:
        description: "Stratégie à backtester"
        type: choice
        default: valuation_gap_multiples_options
        options:
          - valuation_gap_multiples_options
          - valuation_gap_options
          - valuation_gap_expected_value_options
          - valuation_gap_dcf
          - valuation_gap_sector_neutral
      date_debut:
        description: "Date de début (AAAA-MM-JJ)"
        type: string
        default: "2015-01-01"
      args_supplementaires:
        description: "Options en plus, ex: --entry-threshold-pct 25 --stop-loss-pct -40"
        type: string
        default: ""

# Un seul backtest à la fois : deux runs concurrents téléchargeraient les mêmes
# données LFS en double, pour rien.
concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Ce qu'aucun backtest ne lit, et qui pèse l'essentiel du volume LFS :
      # le cache des index de dépôts SEC (246 Mo, reconstruit par 04/04b/04c)
      # et la mémoire des classifications 8-K (utile à 04c seul). Tout le
      # reste est rapatrié -- voir l'en-tête pour le choix exclure/énumérer.
      DONNEES_INUTILES: >-
        data/financials/sec_submissions/**,
        data/financials/cache_8k_mistral.jsonl

    steps:
      - name: Récupérer le code (sans le contenu LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      # Les fichiers LFS sont ici des POINTEURS : leur empreinte change
      # exactement quand leur contenu change, ce qui en fait une clé de cache
      # juste -- et bien plus légère à calculer que le contenu réel.
      - name: Restaurer les objets LFS déjà téléchargés
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('data/**', '!data/financials/sec_submissions/**') }}
          restore-keys: lfs-

      - name: Rapatrier les données (sauf ce qu'aucun backtest ne lit)
        run: |
          set -euo pipefail
          EXCLUS="$(echo "$DONNEES_INUTILES" | tr -d ' \n')"
          git lfs pull --exclude="$EXCLUS"
          echo "Contenu présent :"
          du -sh data/* 2>/dev/null || true

      # Un pointeur oublié ne dit pas son nom : pandas échoue dessus sur
      # « Parquet magic bytes not found in footer », ce qui fait chercher une
      # corruption de données là où il ne manque qu'un rapatriement. Mieux vaut
      # échouer ici, en nommant les fichiers en cause.
      - name: Vérifier qu'aucun fichier n'est resté un pointeur
        run: |
          set -euo pipefail
          python setup_lfs.py --verifier-pointeurs \
            --ignorer "$(echo "$DONNEES_INUTILES" | tr -d ' \n')"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --quiet -r requirements.txt

      - name: Lancer le backtest
        # Les entrées passent par l'environnement et non par une interpolation
        # ${{ }} directement dans le script : une interpolation est substituée
        # AVANT que bash ne s'exécute, ce qui permettrait à une valeur
        # d'entrée d'injecter des commandes.
        env:
          STRATEGIE: ${{ inputs.strategie }}
          DATE_DEBUT: ${{ inputs.date_debut }}
          ARGS: ${{ inputs.args_supplementaires }}
        run: |
          set -euo pipefail
          case "$STRATEGIE" in
            valuation_gap_dcf|valuation_gap_sector_neutral) SCRIPT=09_backtest.py ;;
            *)                                             SCRIPT=10_backtest_options.py ;;
          esac
          echo "Lancement : $SCRIPT --strategy $STRATEGIE --start-date $DATE_DEBUT $ARGS"
          # $ARGS volontairement non quoté : c'est une LISTE d'arguments.
          python "$SCRIPT" --strategy "$STRATEGIE" --start-date "$DATE_DEBUT" $ARGS

      # Racine d'archive stable : sans ce dossier de rassemblement,
      # upload-artifact calcule la racine du zip d'après les fichiers trouvés,
      # et elle changerait selon que le run a produit des sorties actions ou
      # options. recuperer_backtest.py pourrait alors ne plus savoir où
      # extraire.
      - name: Rassembler les résultats
        if: always()
        env:
          STRATEGIE: ${{ inputs.strategie }}
          DATE_DEBUT: ${{ inputs.date_debut }}
          ARGS: ${{ inputs.args_supplementaires }}
        run: |
          set -euo pipefail
          mkdir -p artefact/backtest artefact/backtest_options
          cp -r data/backtest/.         artefact/backtest/         2>/dev/null || true
          cp -r data/backtest_options/. artefact/backtest_options/ 2>/dev/null || true
          cat > artefact/run_distant.json <<JSON
          {
            "strategie": "$STRATEGIE",
            "date_debut": "$DATE_DEBUT",
            "args_supplementaires": "$ARGS",
            "commit": "${{ github.sha }}",
            "run_github": "${{ github.run_id }}",
            "lance_le": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          find artefact -type f | head -50

      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.strategie }}-${{ github.run_id }}
          path: artefact/
          if-no-files-found: warn
          retention-days: 30
